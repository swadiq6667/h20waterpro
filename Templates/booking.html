<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Details</title>
    <link href="{% static 'assets/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'assets/css/style.css' %}" rel="stylesheet">
    <link href="{% static 'assets/css/font-awesome.min.css' %}" rel="stylesheet">
    <style>
        body {
            background: #f5f5f5
            font-family: 'Open Sans', sans-serif;
        }
        .container {
            max-width: 700px;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
            margin-top: 50px;
        }
        h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #007bff;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .btn-custom {
            background: #007bff;
            color: white;
            padding: 12px;
            font-size: 18px;
            border-radius: 5px;
            display: block;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Booking Details</h3>
        <form action="confirm_booking" method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <input class="form-control" type="text" placeholder="Name" name="name" required>
            </div>
            <div class="form-group">
                <input class="form-control" type="text" placeholder="Mobile No." name="phone" required>
            </div>
            <div class="form-group">
                <input class="form-control" type="text" placeholder="Location" name="Location" required>
            </div>
            <div class="form-group">
                <input class="form-control" type="text" placeholder="Pincode" name="pin" required>
            </div>
            <div class="form-group">
                <select class="form-control" name="Place">
                    <option value="" disabled selected>Select City</option>
                    <option value="104">Ahmedabad</option>
                    <option value="105">Kochi</option>
                    <option value="1">Bangalore</option>
                    <option value="47">Chennai</option>
                    <option value="13">Coimbatore</option>
                    <option value="16">Delhi</option>
                </select>
            </div>
            <div class="form-group">
                <select class="form-control" name="State">
                    <option value="" disabled selected>Select State</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Maharashtra">Maharashtra</option>
                </select>
            </div>
            <div class="form-group">
                <input class="form-control" type="text" placeholder="Building/Room No." name="room" required>
            </div>
            <div class="form-group">
                <input class="form-control" type="text" placeholder="Road Name" name="rname" required>
            </div>
            <div class="form-group">
                <input class="form-control" type="text" placeholder="Alternate Mobile No." name="aphone" required>
            </div>
            <div class="form-group">
                <input class="form-control" type="text" placeholder="Landmark" name="land" required>
            </div>
            <a href="{% url 'payment_page' %}" class="btn btn-custom btn-block bg-theme text-white w-100 font-weight-bold text-uppercase" onclick="return confirm('Are you sure?')">Confirm Your Order</a>

        </form>
    </div>
</body>
</html>
